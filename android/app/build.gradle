plugins {
    id 'com.android.application'
}

android {
    namespace 'ec.edu.ups.plumilla'
    compileSdk 34
    ndkVersion '26.1.10909125'   // use la versión de NDK instalada en su Android Studio

    defaultConfig {
        applicationId 'ec.edu.ups.plumilla'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3'
                // opencvsdk se define en gradle.properties
                arguments "-DOpenCV_DIR=${opencvsdk}/sdk/native/jni", '-DANDROID_STL=c++_shared'
            }
        }
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release { minifyEnabled false }
        debug   { jniDebuggable false }   // Release-like: tiempos más reales
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':opencv')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
